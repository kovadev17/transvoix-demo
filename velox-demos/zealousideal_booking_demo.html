<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookingTool - Booking Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f8fafc;color:#1e293b}
.demo-badge{position:fixed;top:16px;right:16px;background:#0ea5e9;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;z-index:100}
.container{max-width:800px;margin:0 auto;padding:40px 20px}
.header{text-align:center;margin-bottom:40px}
.header h1{font-size:32px;color:#0f172a;margin-bottom:8px}
.header p{color:#64748b}
.calendar{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.calendar-header h2{font-size:20px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.days span{text-align:center;font-size:12px;color:#64748b;text-transform:uppercase}
.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.date{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:14px;cursor:pointer;transition:all .2s}
.date:hover{background:#e0f2fe}
.date.active{background:#0ea5e9;color:#fff}
.date.disabled{color:#cbd5e1}
.slots{margin-top:24px}
.slots h3{font-size:16px;margin-bottom:16px}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.slot{padding:12px;text-align:center;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;transition:all .2s}
.slot:hover{border-color:#0ea5e9;background:#f0f9ff}
.footer{text-align:center;margin-top:40px;color:#64748b;font-size:14px}
</style>
</head>
<body>
<div class="demo-badge">VELLOXSTUDIO DEMO</div>
<div class="container">
<div class="header">
<h1>BookingTool</h1>
<p>Book your personal training appointment in seconds</p>
</div>
<div class="calendar">
<div class="calendar-header">
<h2>April 2026</h2>
<span style="color:#64748b">Select a date</span>
</div>
<div class="days">
<span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
</div>
<div class="dates">
<div class="date disabled">30</div><div class="date disabled">31</div>
<div class="date">1</div><div class="date">2</div><div class="date active">3</div><div class="date">4</div><div class="date">5</div>
<div class="date">6</div><div class="date">7</div><div class="date">8</div><div class="date">9</div><div class="date">10</div><div class="date">11</div><div class="date">12</div>
</div>
<div class="slots">
<h3>Available times for April 3</h3>
<div class="slot-grid">
<div class="slot">9:00 AM</div><div class="slot">10:00 AM</div><div class="slot">11:00 AM</div>
<div class="slot">1:00 PM</div><div class="slot">2:00 PM</div><div class="slot">3:00 PM</div>
</div>
</div>
</div>
<div class="footer">
Powered by VeloxStudio demo builder
</div>
</div>
</body>
</html>
